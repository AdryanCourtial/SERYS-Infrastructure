
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: serys
      MYSQL_USER: serys
      MYSQL_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  mailhog:
  image: mailhog/mailhog:v1.0.1
  ports:
    - "1025:1025"
    - "8025:8025"

volumes:
  mysql_data:

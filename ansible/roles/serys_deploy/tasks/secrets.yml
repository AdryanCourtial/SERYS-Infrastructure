- name: Creer le dossier secrets
  ansible.builtin.file:
    path: /opt/serys/infra/secrets
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deployer les fichiers env SERYS
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vault/production/{{ item.src }}"
    dest: "/opt/serys/infra/secrets/{{ item.dest }}"
    owner: root
    group: root
    mode: '0600'
    decrypt: true
  loop:
    - src: infra.env.vault
      dest: .env
    - src: backend.env.vault
      dest: .env.backend
    - src: frontend.env.vault
      dest: .env.frontend
  no_log: true
